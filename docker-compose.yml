version: "3.8"

services:
  db:
    image: postgres:15
    container_name: odoo_qms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_pwd
    volumes:
      - odoo_qms_db_data:/var/lib/postgresql/data

  odoo:
    image: odoo:17.0
    container_name: odoo_qms_web
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_pwd
    volumes:
      - odoo_qms_web_data:/var/lib/odoo
      - ./addons/management-system:/mnt/extra-addons

volumes:
  odoo_qms_db_data:
  odoo_qms_web_data: